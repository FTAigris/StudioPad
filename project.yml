name: StudioPad

options:
  bundleIdPrefix: com.studiopad
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "2"
    DEVELOPMENT_TEAM: ""

packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.0

targets:
  StudioPad:
    type: application
    platform: iOS
    sources:
      - path: StudioPad
      - path: Shared
    info:
      path: StudioPad/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiopad.app
        PRODUCT_NAME: StudioPad
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - target: ScreenBroadcast
        embed: true
      - target: BroadcastSetup
        embed: true

  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenBroadcast
      - path: Shared
    info:
      path: ScreenBroadcast/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiopad.app.ScreenBroadcast
        PRODUCT_NAME: ScreenBroadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit

  BroadcastSetup:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastSetup
      - path: Shared
    info:
      path: BroadcastSetup/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studiopad.app.BroadcastSetup
        PRODUCT_NAME: BroadcastSetup
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
